services:
  mongo:
    image: mongo:7
    container_name: smart-planner-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: smart-planner-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/smart-daily-planner
      - JWT_SECRET=compose_dev_secret_change_me
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: smart-planner-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo_data:
